<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chosen Palette: Warm Neutrals -->
    <!-- Application Structure Plan: A dashboard layout was chosen to provide a comprehensive overview at a glance while allowing for intuitive, interactive filtering. The structure includes a filter sidebar/panel, a summary stats area, two dynamic charts for categorical and price analysis, and a responsive product grid. This is more user-friendly than a simple list as it empowers users to explore the data from multiple angles (category, price, stock) and see the impact of their choices reflected in both the charts and the product list simultaneously. -->
    <!-- Visualization & Content Choices: 
        - Product Data -> Goal: Organize/Display -> Presentation: Responsive Card Grid (HTML/Tailwind) -> Interaction: Dynamically updated by JS based on filters. Justification: Standard, scannable, and familiar UX for product catalogs.
        - Categories -> Goal: Compare/Filter -> Presentation: Filter Buttons -> Interaction: Click to filter grid/charts. Justification: Quick, direct interaction for primary data pivot.
        - Stock Status -> Goal: Filter -> Presentation: Toggle Switch -> Interaction: Toggle to filter. Justification: Clear binary choice for availability.
        - Price -> Goal: Filter -> Presentation: Range Slider -> Interaction: Drag to filter. Justification: Intuitive for selecting a numeric range.
        - Category Distribution -> Goal: Inform/Compare -> Viz: Donut Chart (Chart.js/Canvas) -> Interaction: Updates with filters. Justification: Excellent for showing part-to-whole relationships of product categories.
        - Avg. Price by Category -> Goal: Compare -> Viz: Bar Chart (Chart.js/Canvas) -> Interaction: Updates with filters. Justification: Best for direct comparison of quantitative data (price) across different categories.
        -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            background-color: #FDFBF8;
            font-family: 'Inter', sans-serif;
        }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 350px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }
        .add-to-cart-message {
          position: fixed;
          top: 30px;
          left: 50%;
          transform: translateX(-50%);
          background: #10b981;
          color: #fff;
          padding: 14px 32px;
          border-radius: 8px;
          font-size: 1.1rem;
          font-weight: bold;
          z-index: 9999;
          box-shadow: 0 2px 12px rgba(16,185,129,0.15);
          opacity: 1;
          transition: opacity 0.6s;
        }
        .add-to-cart-message.fade-out {
          opacity: 0;
        }
    </style>
</head>
<body class="text-gray-800">
    <div class="container mx-auto p-4 md:p-8">
        <div style="margin-bottom: 24px; text-align:left;">
            <a href="cart.html" style="display:inline-block; background:#f59e0b; color:#fff; font-weight:bold; padding:10px 22px; border-radius:8px; text-decoration:none; font-size:1rem;">&larr; Return to Market</a>
        </div>
        <div id="product-grid"></div>
    </div>
    <script>
    // --- Cart logic copied from cart.js for cross-page compatibility ---
    function showAddToCartMessage(productName) {
        let msg = document.createElement('div');
        msg.className = 'add-to-cart-message';
        msg.innerText = `${productName} has been added to cart!`;
        document.body.appendChild(msg);
        setTimeout(() => {
            msg.classList.add('fade-out');
            setTimeout(() => document.body.removeChild(msg), 600);
        }, 1200);
    }
    function getCartFromCookie() {
        try {
            const localCart = JSON.parse(localStorage.getItem("africabiz-cart") || "[]");
            if (Array.isArray(localCart)) return localCart;
        } catch (e) {}
        var cookieValue = document.cookie
            .split(';')
            .find(row => row.trim().startsWith('listCart='));
        if (cookieValue) {
            try {
                return JSON.parse(decodeURIComponent(cookieValue.split('=')[1]));
            } catch (e) { return []; }
        }
        return [];
    }
    function saveCartToCookie(listCart) {
        localStorage.setItem("africabiz-cart", JSON.stringify(listCart));
        document.cookie = "listCart=" + encodeURIComponent(JSON.stringify(listCart)) + ";expires=Thu, 31 Dec 2037 12:00:00 UTC;path=/";
    }
    function addCartProduct(product) {
        let listCart = getCartFromCookie();
        let productInCart = listCart.find(p => p.id === product.id && p.itemName === product.itemName);
        if (!productInCart) {
            let dataProduct = JSON.parse(JSON.stringify(product));
            dataProduct.quantity = 1;
            listCart.push(dataProduct);
            showAddToCartMessage(dataProduct.itemName || dataProduct.name);
        } else {
            productInCart.quantity++;
            showAddToCartMessage(productInCart.itemName || productInCart.name);
        }
        saveCartToCookie(listCart);
    }
    // --- End cart logic ---

    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const sellerId = params.get('id');
        if (!sellerId) return;

        fetch('product.json')
          .then(res => res.json())
          .then(products => {
            const seller = products.find(p => p.id == sellerId);
            if (!seller) {
              document.getElementById('product-grid').innerHTML = '<p>Seller not found.</p>';
              return;
            }
            let html = `
              <div style="text-align:center; margin-bottom:32px;">
                <img src="${seller.image}" alt="${seller.name}" style="max-width:200px; border-radius:16px; margin-bottom:16px;">
                <h2 style="font-size:2rem; font-weight:bold;">${seller.name}</h2>
                <p style="font-size:1.2rem; margin:8px 0;">Category: ${seller.category || ''}</p>
              </div>
              <div style="margin-top:16px;">
                <h3 style="font-size:1.5rem; font-weight:bold; margin-bottom:16px;">${seller.category} Offered:</h3>
                <div style="display:flex; flex-wrap:wrap; gap:24px; justify-content:center;">
            `;
            if (Array.isArray(seller.items) && seller.items.length > 0) {
              seller.items.forEach((item, idx) => {
                html += `<div style=\"background:#fff; border-radius:16px; box-shadow:0 2px 8px #eee; padding:18px; min-width:220px; max-width:260px; text-align:left; display:flex; flex-direction:column;\">
                  ${item.image ? `<img src='${item.image}' alt='${item.name}' style='width:100%; height:180px; object-fit:cover; border-radius:12px; margin-bottom:10px;'>` : ''}
                  <h4 style=\"font-size:1.1rem; font-weight:600; margin-bottom:6px;\">${item.name}</h4>
                  <p style=\"margin:0 0 6px 0; font-weight:bold; color:#b45309;\">Price: ${item.price}</p>
                  <ul style=\"padding-left:18px; font-size:0.98rem; color:#444;\">`;
                // Category-specific details
                if (seller.category === 'Burgers' && item.ingredients) {
                  html += `<li><b>Ingredients:</b> ${item.ingredients.join(', ')}</li>`;
                }
                if (seller.category === 'Shoes') {
                  if (item.size) html += `<li><b>Sizes:</b> ${item.size.join(', ')}</li>`;
                  if (item.color) html += `<li><b>Color:</b> ${item.color}</li>`;
                }
                if (seller.category === 'Barber' && item.style) {
                  html += `<li><b>Style:</b> ${item.style}</li>`;
                  html += `<li><b>Duration:</b> ${item.duration}</li>`;
                }
                if (seller.category === 'Makeup' && item.style) {
                  html += `<li><b>Style:</b> ${item.style}</li>`;
                  html += `<li><b>Duration:</b> ${item.duration}</li>`;
                }
                if (seller.category === 'Event Planning' && item.services) {
                  html += `<li><b>Services:</b> ${item.services.join(', ')}</li>`;
                }
                if (seller.category === 'PC Repair') {
                  if (item.name) html += `<li><b>Service:</b> ${item.name}</li>`;
                }
                if (seller.category === 'Printing') {
                  if (item.name) html += `<li><b>Service:</b> ${item.name}</li>`;
                }
                if (seller.category === 'Money Transfer' && item.currencies) {
                  html += `<li><b>Currencies:</b> ${item.currencies.join(', ')}</li>`;
                }
                if (seller.category === 'Saloon') {
                  if (item.name) html += `<li><b>Service:</b> ${item.name}</li>`;
                }
                if (seller.category === 'Meat') {
                  if (item.name) html += `<li><b>Type:</b> ${item.name}</li>`;
                }
                if (seller.category === 'Sports Jersey') {
                  if (item.team) html += `<li><b>Team:</b> ${item.team}</li>`;
                  if (item.size) html += `<li><b>Sizes:</b> ${item.size.join(', ')}</li>`;
                }
                html += `</ul>
                  <button class=\"add-to-cart-btn\" 
                    data-id=\"${seller.id}\"
                    data-name=\"${seller.name.replace(/"/g, '&quot;')}\"
                    data-image=\"${seller.image}\"
                    data-price=\"${item.price}\"
                    data-itemname=\"${item.name.replace(/"/g, '&quot;')}\"
                    data-itemimage=\"${item.image || seller.image}\"
                    style=\"margin-top:auto; background:#10b981; color:#fff; border:none; border-radius:6px; padding:8px 18px; font-weight:bold; cursor:pointer; width:100%;\">Add to Cart</button>
                </div>`;
              });
            } else {
              html += '<p>No items/services listed for this seller.</p>';
            }
            html += '</div></div>';
            document.getElementById('product-grid').innerHTML = html;
            // Attach event listeners for Add to Cart buttons
            document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const prod = {
                        id: Number(this.getAttribute('data-id')),
                        name: this.getAttribute('data-name'),
                        image: this.getAttribute('data-image'),
                        price: this.getAttribute('data-price'),
                        itemName: this.getAttribute('data-itemname'),
                        itemImage: this.getAttribute('data-itemimage')
                    };
                    addCartProduct(prod);
                });
            });
          });
    });
    </script>
</body>
</html>
